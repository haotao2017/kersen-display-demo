services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file:
      - ../.env.aws
    environment:
      DATABASE_URL: postgresql://kersen:${POSTGRES_PASSWORD}@postgres:5432/kersen_esl?schema=public
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      STORE_JSON_PATH: /app/data/store.json
      ESL_AP_REFRESH_CONCURRENCY: ${ESL_AP_REFRESH_CONCURRENCY:-6}
      ESL_AP_REFRESH_SLOT_HOLD_MS: ${ESL_AP_REFRESH_SLOT_HOLD_MS:-30000}
      ESL_REFRESH_WORKER_CONCURRENCY: ${ESL_REFRESH_WORKER_CONCURRENCY:-12}
      ESL_REFRESH_AUTO_RETRY: ${ESL_REFRESH_AUTO_RETRY:-true}
      ESL_REFRESH_DEFERRED_RETRY_MAX: ${ESL_REFRESH_DEFERRED_RETRY_MAX:-10}
      ESL_REFRESH_DEFERRED_RETRY_DELAY_MS: ${ESL_REFRESH_DEFERRED_RETRY_DELAY_MS:-30000}
      ESL_REFRESH_RETRY_WAKE_WAIT_MS: ${ESL_REFRESH_RETRY_WAKE_WAIT_MS:-9000}
      ESL_REFRESH_PRE_WAKE_DELAY_MS: ${ESL_REFRESH_PRE_WAKE_DELAY_MS:-800}
      ESL_REFRESH_PRE_WRITE_DELAY_MS: ${ESL_REFRESH_PRE_WRITE_DELAY_MS:-1200}
      ESL_LABEL_KEEPALIVE_BATCH_SIZE: ${ESL_LABEL_KEEPALIVE_BATCH_SIZE:-10}
      LABEL_ONLINE_STABLE_SECONDS: ${LABEL_ONLINE_STABLE_SECONDS:-900}
      LABEL_OFFLINE_PROBE_RETRY_DELAY_MS: ${LABEL_OFFLINE_PROBE_RETRY_DELAY_MS:-30000}
      LABEL_OFFLINE_PROBE_MAX: ${LABEL_OFFLINE_PROBE_MAX:-3}
      AP_ONLINE_LABEL_TRUST_DELAY_MS: ${AP_ONLINE_LABEL_TRUST_DELAY_MS:-600000}
      AP_WRITE_SVC_CONFIRM_TIMEOUT_MS: ${AP_WRITE_SVC_CONFIRM_TIMEOUT_MS:-20000}
      PERSISTENT_SAVE_DEBOUNCE_MS: ${PERSISTENT_SAVE_DEBOUNCE_MS:-5000}
      PRISMA_TRANSACTION_MAX_WAIT_MS: ${PRISMA_TRANSACTION_MAX_WAIT_MS:-15000}
      PRISMA_TRANSACTION_TIMEOUT_MS: ${PRISMA_TRANSACTION_TIMEOUT_MS:-60000}
    ports:
      - "4000:4000"
      - "1883:1883"
    volumes:
      - api_uploads:/app/uploads
      - api_data:/app/data
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/ready | grep '\"ok\":true'"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_EVENTS_URL: /api/v1/events/stream
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kersen_esl
      POSTGRES_USER: kersen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kersen -d kersen_esl"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  api_uploads:
  api_data:
